<script>
// Idea & vision by TEESHTOPUCHO · Code implementation by DeepSeek AI · 2026 · MIT License
(() => {
  const STATE = {
    isHost: false, roomName: '', hostPeerId: null, peer: null, hostConn: null,
    connections: [], myName: '', myColor: '#4f6ef6', status: 'online',
    users: {}, usersColors: {}, usersStatus: {}, userGroups: {},
    groups: [], currentGroupId: null, voiceStream: null,
    voiceCallsByGroup: {}, voiceParticipants: {}, myVoiceGroup: null,
    maxUsers: 5, replyTo: null,
    lastActivity: Date.now(), unreadCounts: {},
    messageSoundEnabled: true, joinLeaveSoundEnabled: true,
    userSpeaking: {}, streamsWaiting: new Map(), audioContext: null,
    userInteracted: false, reactionUsers: {},
    autoAwayTimer: null, darkMode: false, oneTimeLink: false,
    roomLocked: false,
  };

  // Dark mode
  function toggleDark() {
    STATE.darkMode = !STATE.darkMode;
    document.body.classList.toggle('dark', STATE.darkMode);
    localStorage.setItem('echo_dark', STATE.darkMode);
  }
  document.getElementById('darkModeBtn').onclick = toggleDark;
  document.getElementById('darkModeBtn2').onclick = toggleDark;
  if (localStorage.getItem('echo_dark') === 'true') { toggleDark(); }

  // Auto away
  function resetAutoAway() {
    STATE.lastActivity = Date.now();
    if (STATE.status === 'away') {
      STATE.status = 'online';
      if (STATE.isHost) { STATE.usersStatus[STATE.peer.id] = 'online'; broadcastUserList(); }
      else STATE.hostConn?.send({type:'change-status', status:'online'});
      renderUserList();
    }
    if (STATE.autoAwayTimer) clearTimeout(STATE.autoAwayTimer);
    STATE.autoAwayTimer = setTimeout(() => {
      if (STATE.status === 'online') {
        STATE.status = 'away';
        if (STATE.isHost) { STATE.usersStatus[STATE.peer.id] = 'away'; broadcastUserList(); }
        else STATE.hostConn?.send({type:'change-status', status:'away'});
        renderUserList();
      }
    }, 300000);
  }
  document.addEventListener('mousemove', resetAutoAway);
  document.addEventListener('keydown', resetAutoAway);
  document.addEventListener('click', resetAutoAway);

  // Audio
  function playStreams() {
    if (STATE.audioContext && STATE.audioContext.state === 'suspended') STATE.audioContext.resume();
    STATE.streamsWaiting.forEach((stream, peerId) => {
      const audio = new Audio();
      audio.srcObject = stream;
      audio.volume = 1.0; // no per-user volume yet
      audio.play().catch(() => {});
      if (STATE.myVoiceGroup && STATE.voiceCallsByGroup[STATE.myVoiceGroup]?.[peerId]) {
        STATE.voiceCallsByGroup[STATE.myVoiceGroup][peerId].remoteAudio = audio;
      }
      STATE.streamsWaiting.delete(peerId);
    });
  }
  document.addEventListener('click', () => { if (!STATE.userInteracted) STATE.userInteracted = true; playStreams(); }, { once: false });
  function onRemoteStream(peerId, stream) { STATE.streamsWaiting.set(peerId, stream); if (STATE.userInteracted) playStreams(); }

  function playSound(type) {
    if (!STATE.audioContext) STATE.audioContext = new (window.AudioContext||window.webkitAudioContext)();
    const osc = STATE.audioContext.createOscillator(), gain = STATE.audioContext.createGain();
    osc.connect(gain); gain.connect(STATE.audioContext.destination);
    if (type==='message') { osc.frequency.value=800; gain.gain.setValueAtTime(0.08,STATE.audioContext.currentTime); osc.start(); osc.stop(STATE.audioContext.currentTime+0.1); }
    else if (type==='join') { osc.frequency.value=500; gain.gain.setValueAtTime(0.06,STATE.audioContext.currentTime); osc.start(); osc.stop(STATE.audioContext.currentTime+0.15); }
    else if (type==='leave') { osc.frequency.value=400; gain.gain.setValueAtTime(0.06,STATE.audioContext.currentTime); osc.start(); osc.stop(STATE.audioContext.currentTime+0.2); }
  }

  function randomName() { const p=['Echo','Node','Phantom','Drift','Void','Pixel','Flux','Mirage']; return p[Math.floor(Math.random()*p.length)]+'-'+Math.floor(Math.random()*90+10); }
  function escapeHtml(t) { return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function colorFromName(n) { let h=0; for(let i=0;i<n.length;i++) h=n.charCodeAt(i)+((h<<5)-h); return `hsl(${h%360},60%,65%)`; }

  // DOM
  const landing = document.getElementById('landing'), appDiv = document.getElementById('app');
  const roomTitleEl = document.getElementById('roomTitle'), chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput'), groupListEl = document.getElementById('groupList');
  const usersListEl = document.getElementById('usersList'), usersCountEl = document.getElementById('usersCount');
  const sendChatBtn = document.getElementById('sendChatBtn');
  const replyIndicator = document.getElementById('replyIndicator');
  const createRoomBtn = document.getElementById('createRoomBtn'), joinLinkBtn = document.getElementById('joinLinkBtn');
  const joinInlineWrapper = document.getElementById('joinInlineWrapper'), joinLinkInput = document.getElementById('joinLinkInput');
  const connectViaLinkBtn = document.getElementById('connectViaLinkBtn');
  const addGroupBtn = document.getElementById('addGroupBtn'), copyInviteBtn = document.getElementById('copyInviteBtn');
  const saveRoomBtn = document.getElementById('saveRoomBtn'), settingsBtn = document.getElementById('settingsBtn');
  const loadRoomBtn = document.getElementById('loadRoomBtn'), loadRoomFile = document.getElementById('loadRoomFile');
  const searchInput = document.getElementById('searchInput'), emojiBtn = document.getElementById('emojiBtn');
  const lockRoomBtn = document.getElementById('lockRoomBtn');
  const createRoomModal = document.getElementById('createRoomModal');
  const newRoomNameInput = document.getElementById('newRoomNameInput');
  const newHostNameInput = document.getElementById('newHostNameInput');

  joinLinkBtn.onclick = () => { joinLinkBtn.classList.add('hidden'); joinInlineWrapper.classList.remove('hidden'); joinLinkInput.focus(); };
  function joinRoom() {

    try {

      const host = p.get('host'), room = p.get('room')||'joined';
      if(host) initClient(host, room);
    } catch(e) { alert('Invalid invite link'); }
  }
  connectViaLinkBtn.onclick = joinRoom;
  joinLinkInput.addEventListener('keydown', e => { if(e.key==='Enter') joinRoom(); });

  createRoomBtn.onclick = () => {
    newRoomNameInput.value = '';
    newHostNameInput.value = '';
    document.querySelector('input[name="maxUsersRadio"][value="5"]').checked = true;
    createRoomModal.classList.remove('hidden');
  };

  lockRoomBtn.onclick = () => {

    if (!STATE.isHost) return;
    broadcastRoomLocked();
  };
  function broadcastRoomLocked() { STATE.connections.forEach(c => c.conn.send({type:'room-locked', locked: STATE.roomLocked})); }

  addGroupBtn.onclick = () => {
    if(!STATE.isHost) return;
    const existing = document.querySelector('.group-add-modal'); if(existing) existing.remove();
    const popup = document.createElement('div'); popup.className='group-add-modal';
    popup.style.position='absolute'; popup.style.top='60px'; popup.style.left='10px';
    popup.innerHTML = `<input type="text" id="newGroupName" placeholder="Group name" style="padding:0.3rem; border:1px solid #b4cee4; border-radius:0.5rem; flex:1;"><button id="createGroupBtn" class="btn btn-primary" style="padding:0.3rem 0.8rem;">Create</button><button id="cancelGroupBtn" class="btn" style="padding:0.3rem 0.8rem;">Cancel</button>`;
    document.querySelector('.sidebar').appendChild(popup);
    const nameInput = popup.querySelector('#newGroupName'); nameInput.focus();
    const createGroup = () => { const name=nameInput.value.trim(); if(name){ const gid='group-'+Date.now().toString(36); STATE.groups.push({id:gid, name, messages:[]}); broadcastGroupList(); renderGroups(); } popup.remove(); };
    popup.querySelector('#createGroupBtn').onclick = createGroup;
    nameInput.addEventListener('keydown', e => { if(e.key==='Enter') createGroup(); });
    popup.querySelector('#cancelGroupBtn').onclick = () => popup.remove();
  };

  function saveHistoryToLocal() {
    const group = STATE.groups.find(g=>g.id===STATE.currentGroupId);
    if(group) localStorage.setItem(`echo_${STATE.roomName}_${group.id}`, JSON.stringify(group.messages));
  }
  function loadHistoryFromLocal(groupId) {
    const group = STATE.groups.find(g=>g.id===groupId);
    if(group) { const saved = localStorage.getItem(`echo_${STATE.roomName}_${groupId}`); if(saved) try { group.messages = JSON.parse(saved); } catch(e) {} }
  }

  // Voice
  async function joinVoiceGroup(groupId) {
    if (STATE.myVoiceGroup === groupId) return;
    if (STATE.myVoiceGroup) leaveVoiceGroup();
    if (!STATE.voiceStream) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        STATE.voiceStream = stream;
        stream.getAudioTracks().forEach(t => t.enabled = true);
        startSpeakingDetection(stream);
      } catch(e) { alert('Microphone denied'); return; }
    }
    STATE.myVoiceGroup = groupId;
    if (!STATE.voiceParticipants[groupId]) STATE.voiceParticipants[groupId] = new Set();
    STATE.voiceParticipants[groupId].add(STATE.peer.id);
    if (STATE.isHost) broadcastVoiceUpdate(groupId, 'join', STATE.peer.id);
    else STATE.hostConn.send({type:'voice-join', groupId});
    connectToVoiceParticipants(groupId);
    renderGroups();
  }

  function leaveVoiceGroup() {
    const gid = STATE.myVoiceGroup; if (!gid) return;
    STATE.voiceParticipants[gid]?.delete(STATE.peer.id);
    if (STATE.isHost) broadcastVoiceUpdate(gid, 'leave', STATE.peer.id);
    else STATE.hostConn.send({type:'voice-leave', groupId:gid});
    closeVoiceCallsInGroup(gid);
    STATE.myVoiceGroup = null;
    renderGroups();
  }

  let speakingAnalyser = null, speakingInterval = null;
  function startSpeakingDetection(stream) {
    if (speakingAnalyser) return;
    const actx = new (window.AudioContext||window.webkitAudioContext)();
    const analyser = actx.createAnalyser(); analyser.fftSize = 256;
    const source = actx.createMediaStreamSource(stream);
    source.connect(analyser);
    speakingAnalyser = analyser;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    speakingInterval = setInterval(() => {
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i=0; i<bufferLength; i++) sum += dataArray[i];
      const speaking = (sum / bufferLength) > 20;
      if (STATE.isHost) broadcastSpeaking(STATE.peer.id, speaking);
      else if (STATE.hostConn) STATE.hostConn.send({type:'speaking', state: speaking});
      STATE.userSpeaking[STATE.peer.id] = speaking;
      updateSpeakingUI(STATE.peer.id, speaking);
    }, 200);
  }
  // stopSpeakingDetection removed (unused) – speaking detection continues while voiceStream exists
  function broadcastSpeaking(peerId, speaking) { STATE.connections.forEach(c => c.conn.send({type:'speaking-update', peerId, speaking})); STATE.userSpeaking[peerId] = speaking; updateSpeakingUI(peerId, speaking); }
  function updateSpeakingUI(peerId, speaking) {
    const el = document.querySelector(`.user-item[data-peer="${peerId}"] .speaking-indicator`);
    const pulse = document.querySelector(`.user-item[data-peer="${peerId}"] .pulse-bar`);
    if (el) {
      if (speaking) { el.classList.add('speaking-active'); if (!pulse) { const p = document.createElement('span'); p.className='pulse-bar'; el.parentNode.appendChild(p); } }
      else { el.classList.remove('speaking-active'); if (pulse) pulse.remove(); }
    }
  }

  function connectToVoiceParticipants(groupId) {
    const participants = STATE.voiceParticipants[groupId] || new Set();
    participants.forEach(pid => {
      if (pid !== STATE.peer.id && !STATE.voiceCallsByGroup[groupId]?.[pid]) {
        const call = STATE.peer.call(pid, STATE.voiceStream, { metadata: { type:'voice', groupId } });
        setupCall(call, pid, groupId);
        if (!STATE.voiceCallsByGroup[groupId]) STATE.voiceCallsByGroup[groupId] = {};
        STATE.voiceCallsByGroup[groupId][pid] = call;
      }
    });
  }

  function setupCall(call, peerId, groupId) {
    call.on('stream', remoteStream => onRemoteStream(peerId, remoteStream));
    call.on('close', () => {
      if (STATE.voiceCallsByGroup[groupId]?.[peerId]) {
        if (STATE.voiceCallsByGroup[groupId][peerId].remoteAudio) STATE.voiceCallsByGroup[groupId][peerId].remoteAudio.srcObject = null;
        delete STATE.voiceCallsByGroup[groupId][peerId];
      }
      STATE.streamsWaiting.delete(peerId);
    });
  }

  function closeVoiceCallsInGroup(groupId) { const calls = STATE.voiceCallsByGroup[groupId] || {}; Object.values(calls).forEach(c => c.close()); delete STATE.voiceCallsByGroup[groupId]; }
  function broadcastVoiceUpdate(groupId, action, peerId) { STATE.connections.forEach(c => c.conn.send({type:'voice-update', groupId, peerId, action})); }

  function hostHandleCall(call) {
    if (!STATE.voiceStream) { call.close(); return; }
    const groupId = call.metadata?.groupId;
    if (groupId) { call.answer(STATE.voiceStream); setupCall(call, call.peer, groupId); if (!STATE.voiceCallsByGroup[groupId]) STATE.voiceCallsByGroup[groupId] = {}; STATE.voiceCallsByGroup[groupId][call.peer] = call; }
    else { const gid = Object.entries(STATE.voiceParticipants).find(([gid,set])=>set.has(call.peer))?.[0]; if (gid) { call.answer(STATE.voiceStream); setupCall(call, call.peer, gid); } else call.close(); }
  }

  function clientHandleCall(call) {
    if (!STATE.voiceStream) { call.close(); return; }
    const groupId = call.metadata?.groupId;
    if (groupId) { call.answer(STATE.voiceStream); setupCall(call, call.peer, groupId); if (!STATE.voiceCallsByGroup[groupId]) STATE.voiceCallsByGroup[groupId] = {}; STATE.voiceCallsByGroup[groupId][call.peer] = call; }
    else { const gid = Object.entries(STATE.voiceParticipants).find(([gid,set])=>set.has(call.peer))?.[0]; if (gid) { call.answer(STATE.voiceStream); setupCall(call, call.peer, gid); } else call.close(); }
  }

  function renderGroups() {
    groupListEl.innerHTML = '';
    STATE.groups.forEach(g => {
      const li = document.createElement('li');
      li.className = 'group-item' + (STATE.currentGroupId===g.id ? ' active' : '');
      const vcount = STATE.voiceParticipants[g.id]?.size || 0;
      li.innerHTML = `<span># ${g.name}</span>`;
      const voiceBtn = document.createElement('button');
      voiceBtn.className = 'group-voice-btn';
      const isInVoice = STATE.voiceParticipants[g.id]?.has(STATE.peer.id);
      voiceBtn.innerHTML = isInVoice ? '🔊 Voice ON' : '🎙️ Voice OFF';
      if (vcount > 0) voiceBtn.innerHTML += `<span class="voice-count">${vcount}</span>`;
      voiceBtn.onclick = (e) => { e.stopPropagation(); isInVoice ? leaveVoiceGroup() : joinVoiceGroup(g.id); };
      li.appendChild(voiceBtn);
      if (STATE.isHost) { const delBtn = document.createElement('button'); delBtn.className = 'delete-group-btn'; delBtn.innerHTML = '✕'; delBtn.onclick = (e) => { e.stopPropagation(); if(confirm(`Delete ${g.name}?`)) deleteGroup(g.id); }; li.appendChild(delBtn); }
      if (STATE.unreadCounts[g.id]) { const badge = document.createElement('span'); badge.className = 'unread-badge'; badge.textContent = STATE.unreadCounts[g.id]; li.appendChild(badge); }
      li.onclick = () => switchGroup(g.id);
      groupListEl.appendChild(li);
    });
  }

  function switchGroup(groupId) {
    saveHistoryToLocal(); STATE.currentGroupId = groupId;
    loadHistoryFromLocal(groupId); renderChat(); renderGroups();
    STATE.unreadCounts[groupId] = 0;
    STATE.userGroups[STATE.peer.id] = groupId;
    updateCurrentGroupForUser(groupId);
    renderUserList();
  }

  function deleteGroup(groupId) { STATE.groups = STATE.groups.filter(g=>g.id!==groupId); if(STATE.currentGroupId===groupId) STATE.currentGroupId = STATE.groups[0]?.id || null; if(STATE.isHost) broadcastGroupList(); renderGroups(); if(STATE.currentGroupId) switchGroup(STATE.currentGroupId); }
  function updateCurrentGroupForUser(groupId) { if (STATE.isHost) { STATE.userGroups[STATE.peer.id] = groupId; broadcastUserList(); } else STATE.hostConn.send({type:'switch-group', groupId}); }

  function renderChat(filter='') {
    chatArea.innerHTML = '';
    const group = STATE.groups.find(g=>g.id===STATE.currentGroupId);
    if(!group) return;
    let lastDate='';
    group.messages.forEach(msg => {
      if (filter && !msg.text.toLowerCase().includes(filter.toLowerCase())) return;
      const d = new Date(msg.time).toLocaleDateString();
      if (d!==lastDate) { const sep = document.createElement('div'); sep.className='day-separator'; sep.innerHTML = `<span>📅 ${d}</span>`; chatArea.appendChild(sep); lastDate = d; }
      const block = document.createElement('div'); block.className = 'message-block';
      if (msg.replyTo) { const quote = document.createElement('div'); quote.className = 'reply-quote'; quote.innerHTML = `↩️ <b>${escapeHtml(msg.replyTo.user)}</b>: ${escapeHtml(msg.replyTo.text.substring(0,80))}`; block.appendChild(quote); }
      const line = document.createElement('div');
      line.className = 'chat-line' + (msg.name===STATE.myName?' own-message':'');
      line.innerHTML = `<span class="chat-time">${new Date(msg.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><span class="chat-name">${escapeHtml(msg.name)}</span><span class="chat-text">${escapeHtml(msg.text)}</span>`;
      line.addEventListener('contextmenu', e => { e.preventDefault(); showReactionPopup(e, msg); });
      block.appendChild(line);
      if (msg.reactions) {
        const reactionsDiv = document.createElement('div'); reactionsDiv.className = 'reactions';
        Object.entries(msg.reactions).forEach(([emoji, count]) => {
          const span = document.createElement('span'); span.className = 'reaction-badge'; span.textContent = `${emoji} ${count}`;
          span.onclick = (e) => { e.stopPropagation(); showReactionUsers(msg.id, emoji, span); };
          reactionsDiv.appendChild(span);
        });
        block.appendChild(reactionsDiv);
      }
      chatArea.appendChild(block);
    });
    chatArea.scrollTop = chatArea.scrollHeight; saveHistoryToLocal();
  }

  function showReactionUsers(msgId, emoji, element) {
    const existing = document.querySelector('.reaction-users-popup'); if (existing) existing.remove();
    const users = STATE.reactionUsers[msgId]?.[emoji] || new Set();
    let names = Array.from(users).map(id => STATE.users[id] || 'Unknown').join(', ');
    if (!names) names = 'Nobody yet';
    const popup = document.createElement('div'); popup.className = 'reaction-users-popup'; popup.textContent = names;
    document.body.appendChild(popup);
    const rect = element.getBoundingClientRect();
    popup.style.position = 'fixed'; popup.style.left = rect.left + 'px'; popup.style.top = (rect.bottom + 4) + 'px';
    const closePopup = (e) => { if (!popup.contains(e.target) && e.target !== element) { popup.remove(); document.removeEventListener('click', closePopup); } };
    document.addEventListener('click', closePopup);
  }

  function showReactionPopup(e, msg) {
    const existing = document.querySelector('.reaction-popup'); if(existing) existing.remove();
    const popup = document.createElement('div'); popup.className = 'reaction-popup'; popup.style.left = e.clientX+'px'; popup.style.top = e.clientY+'px';
    const emojis = ['👍', '😂', '❤️', '😮', '😢', '😡', '🎉', '👏'];
    emojis.forEach(emoji => {
      const btn = document.createElement('button'); btn.style.background='none'; btn.style.border='none'; btn.style.fontSize='1.2rem'; btn.style.cursor='pointer'; btn.textContent = emoji;
      btn.onclick = () => { addReaction(msg.id, emoji); popup.remove(); };
      popup.appendChild(btn);
    });
    const replyBtn = document.createElement('button'); replyBtn.textContent='↩️ Reply'; replyBtn.style.fontSize='0.8rem'; replyBtn.style.background='none'; replyBtn.style.border='none';
    replyBtn.onclick = () => { STATE.replyTo = { user: msg.name, text: msg.text }; replyIndicator.classList.remove('hidden'); replyIndicator.innerHTML = `Replying to ${msg.name} <button onclick="cancelReply()">✕</button>`; popup.remove(); };
    popup.appendChild(replyBtn);
    document.body.appendChild(popup);
    document.addEventListener('click', () => popup.remove(), { once: true });
  }

  function addReaction(msgId, emoji) {
    const group = STATE.groups.find(g => g.id === STATE.currentGroupId);
    if (!group) return; const msg = group.messages.find(m => m.id === msgId); if (!msg) return;
    if (!STATE.reactionUsers[msgId]) STATE.reactionUsers[msgId] = {};
    if (!STATE.reactionUsers[msgId][emoji]) STATE.reactionUsers[msgId][emoji] = new Set();
    if (STATE.reactionUsers[msgId][emoji].has(STATE.peer.id)) return;
    STATE.reactionUsers[msgId][emoji].add(STATE.peer.id);
    if (!msg.reactions) msg.reactions = {};
    msg.reactions[emoji] = STATE.reactionUsers[msgId][emoji].size;
    if (STATE.isHost) broadcastReaction(msgId, emoji); else STATE.hostConn.send({ type: 'reaction', groupId: STATE.currentGroupId, msgId, emoji, peerId: STATE.peer.id });
    renderChat();
  }

  function handleRemoteReaction(data) {
    const { groupId, msgId, emoji, peerId } = data;
    if (!STATE.reactionUsers[msgId]) STATE.reactionUsers[msgId] = {};
    if (!STATE.reactionUsers[msgId][emoji]) STATE.reactionUsers[msgId][emoji] = new Set();
    if (STATE.reactionUsers[msgId][emoji].has(peerId)) return;
    STATE.reactionUsers[msgId][emoji].add(peerId);
    const group = STATE.groups.find(g => g.id === groupId);
    if (group) { const msg = group.messages.find(m => m.id === msgId); if (msg) { if (!msg.reactions) msg.reactions = {}; msg.reactions[emoji] = STATE.reactionUsers[msgId][emoji].size; } }
    if (STATE.currentGroupId === groupId) renderChat();
  }

  function broadcastReaction(msgId, emoji) { STATE.connections.forEach(c => c.conn.send({ type: 'reaction', groupId: STATE.currentGroupId, msgId, emoji, peerId: STATE.peer.id })); }

  window.cancelReply = () => { STATE.replyTo = null; replyIndicator.classList.add('hidden'); };

  function sendMessage() {
    const text = chatInput.value.trim(); if (!text) return;
    if (/https?:\/\//.test(text)) { alert('No links allowed.'); return; }
    const msg = { type:'chat', groupId:STATE.currentGroupId, name:STATE.myName, text, time:Date.now(), replyTo:STATE.replyTo, peerId:STATE.peer.id, id: Date.now().toString(36)+Math.random() };
    processMessage(msg);
    if (STATE.isHost) broadcastToGroup(STATE.currentGroupId, {...msg, type:'chat-broadcast'}); else STATE.hostConn.send(msg);
    chatInput.value = ''; cancelReply(); if (STATE.messageSoundEnabled) playSound('message');
  }
  function processMessage(msg) { const group = STATE.groups.find(g=>g.id===msg.groupId); if(!group) return; group.messages.push(msg); if (STATE.currentGroupId===msg.groupId) renderChat(); else STATE.unreadCounts[msg.groupId] = (STATE.unreadCounts[msg.groupId]||0)+1; saveHistoryToLocal(); }

  function renderUserList() {
    usersListEl.innerHTML = '';
    Object.entries(STATE.users).forEach(([peerId, name]) => {
      const li = document.createElement('li'); li.className = 'user-item'; li.dataset.peer = peerId;
      const status = STATE.usersStatus[peerId] || 'online';
      const groupId = STATE.userGroups[peerId];
      const groupName = groupId ? '#'+ (STATE.groups.find(g=>g.id===groupId)?.name || groupId) : '';
      const speaking = STATE.userSpeaking[peerId] || false;
      li.innerHTML = `
        <div style="display:flex;align-items:center;gap:0.3rem;flex:1;">
          <span style="color:${STATE.usersColors[peerId]||colorFromName(name)};font-weight:600;">${name}</span>
          <span class="user-group-text">${groupName}</span>
          <span class="speaking-indicator">🔊</span>
          <span class="user-status-text">${status}</span>
        </div>
      `;
      if (STATE.userSpeaking[peerId]) {
        const ind = li.querySelector('.speaking-indicator');
        ind?.classList.add('speaking-active');
        if (!li.querySelector('.pulse-bar')) { const p = document.createElement('span'); p.className='pulse-bar'; li.appendChild(p); }
      }
      usersListEl.appendChild(li);
    });
    usersCountEl.textContent = Object.keys(STATE.users).length;
  }

  // Networking
  function initHost(roomName, customName) {
    STATE.isHost = true; STATE.roomName = roomName;
    STATE.myName = customName || randomName(); STATE.myColor = colorFromName(STATE.myName);
    document.getElementById('settingsBtn').classList.remove('hidden');
    document.getElementById('darkModeBtn2').classList.remove('hidden');
    document.getElementById('saveRoomBtn').classList.remove('hidden');
    document.getElementById('lockRoomBtn').classList.remove('hidden');
    document.getElementById('addGroupBtn').classList.remove('hidden');
    STATE.peer = new Peer(undefined, {debug:0});
    STATE.peer.on('open', id => {
      STATE.hostPeerId = id; STATE.users[id] = STATE.myName;
      STATE.usersColors[id] = STATE.myColor; STATE.usersStatus[id] = STATE.status;
      STATE.groups = [{id:'lobby', name:'Lobby', messages:[]}]; STATE.currentGroupId = 'lobby';
      STATE.userGroups[id] = 'lobby';
      loadHistoryFromLocal('lobby');
      window.location.hash = `room=${roomName}&host=${id}`;
      showApp(); roomTitleEl.textContent = roomName; renderGroups(); renderUserList(); renderChat();
    });
    STATE.peer.on('connection', conn => {
      conn.on('open', () => {
        if (STATE.roomLocked) { conn.send({type:'room-locked'}); return; }
        if (STATE.oneTimeLink && STATE.connections.length > 0) { conn.send({type:'room-full'}); return; }
        if (STATE.connections.length >= STATE.maxUsers) { conn.send({type:'room-full'}); return; }
        STATE.connections.push({conn, peerId:conn.peer});
        conn.send({type:'current-state', groups:STATE.groups.map(g=>({id:g.id,name:g.name})), voiceParticipants:Object.fromEntries(Object.entries(STATE.voiceParticipants).map(([k,v])=>[k,[...v]])), userGroups:STATE.userGroups});
        conn.on('data', data => handleHostData(conn, data));
        conn.on('close', () => removeConnection(conn));
      });
    });
    STATE.peer.on('call', hostHandleCall);
  }

  function handleHostData(conn, data) {
    const pid = conn.peer;
    switch(data.type) {
      case 'join': { STATE.users[pid] = data.name; STATE.usersColors[pid] = data.color; STATE.usersStatus[pid] = data.status; STATE.userGroups[pid] = data.groupId || 'lobby'; broadcastUserList(); renderUserList(); conn.send({type:'group-history', groupId:STATE.currentGroupId, messages:STATE.groups.find(g=>g.id===STATE.currentGroupId)?.messages||[]}); if(STATE.joinLeaveSoundEnabled) playSound('join'); break; }
      case 'chat': processMessage(data); broadcastToGroup(data.groupId, {...data, type:'chat-broadcast'}, pid); break;
      case 'add-group': { const gid='group-'+Date.now().toString(36); STATE.groups.push({id:gid, name:data.name, messages:[]}); broadcastGroupList(); break; }
      case 'voice-join': { const groupId = data.groupId; if (!STATE.voiceParticipants[groupId]) STATE.voiceParticipants[groupId] = new Set(); STATE.voiceParticipants[groupId].add(pid); broadcastVoiceUpdate(groupId, 'join', pid); connectToVoiceParticipants(groupId); renderGroups(); break; }
      case 'voice-leave': { const groupId = data.groupId; STATE.voiceParticipants[groupId]?.delete(pid); broadcastVoiceUpdate(groupId, 'leave', pid); closeVoiceCallsOfPeer(groupId, pid); renderGroups(); break; }
      case 'change-status': STATE.usersStatus[pid] = data.status; broadcastUserList(); renderUserList(); break;
      case 'switch-group': STATE.userGroups[pid] = data.groupId; broadcastUserList(); renderUserList(); break;
      case 'speaking': broadcastSpeaking(pid, data.state); break;
      case 'reaction': { handleRemoteReaction({ groupId: data.groupId, msgId: data.msgId, emoji: data.emoji, peerId: pid }); break; }
    }
  }

  function removeConnection(conn) {
    const idx = STATE.connections.findIndex(c=>c.conn===conn);
    if(idx>=0) {
      const pid = STATE.connections[idx].peerId;
      const name = STATE.users[pid] || 'Unknown';
      delete STATE.users[pid]; delete STATE.usersColors[pid]; delete STATE.usersStatus[pid]; delete STATE.userSpeaking[pid];
      STATE.connections.splice(idx,1);
      Object.entries(STATE.voiceParticipants).forEach(([gid, set]) => { if (set.has(pid)) { set.delete(pid); broadcastVoiceUpdate(gid, 'leave', pid); } });
      const leaveMsg = { type:'chat', groupId:STATE.currentGroupId, name:'System', text:`${name} left the room`, time:Date.now(), peerId:'system', id: Date.now().toString(36) };
      processMessage(leaveMsg);
      broadcastToGroup(STATE.currentGroupId, {...leaveMsg, type:'chat-broadcast'});
      broadcastUserList(); renderUserList();
      if(STATE.joinLeaveSoundEnabled) playSound('leave');
    }
  }

  function broadcastUserList() {
    const list = Object.entries(STATE.users).map(([id,name]) => ({peerId:id, name, color:STATE.usersColors[id], status:STATE.usersStatus[id], groupId:STATE.userGroups[id]}));
    STATE.connections.forEach(c => c.conn.send({type:'user-list', users:list}));
  }
  function broadcastToGroup(gid, msg, exclude) { STATE.connections.forEach(c => { if(c.peerId!==exclude) c.conn.send(msg); }); }
  function broadcastGroupList() { STATE.connections.forEach(c => c.conn.send({type:'group-list', groups:STATE.groups.map(g=>({id:g.id,name:g.name}))})); }

  function initClient(hostId, roomName) {
    STATE.isHost = false; STATE.roomName = roomName;
    STATE.myName = randomName(); STATE.myColor = colorFromName(STATE.myName);
    STATE.peer = new Peer(undefined, {debug:0});
    STATE.peer.on('open', id => {
      STATE.hostConn = STATE.peer.connect(hostId, {reliable:true});
      STATE.hostConn.on('open', () => STATE.hostConn.send({type:'join', name:STATE.myName, color:STATE.myColor, status:STATE.status, groupId:'lobby'}));
      STATE.hostConn.on('data', data => handleClientData(data));
      STATE.hostConn.on('close', () => { alert('Host left. Room closed.'); location.reload(); });
      showApp(); roomTitleEl.textContent = roomName;
    });
    STATE.peer.on('call', clientHandleCall);
  }

  function handleClientData(data) {
    switch(data.type) {
      case 'user-list': STATE.users = {}; data.users.forEach(u => { STATE.users[u.peerId]=u.name; STATE.usersColors[u.peerId]=u.color; STATE.usersStatus[u.peerId]=u.status; STATE.userGroups[u.peerId]=u.groupId; }); renderUserList(); break;
      case 'current-state': STATE.groups = data.groups.map(g => ({...g, messages:[]})); if (!STATE.groups.some(g=>g.id===STATE.currentGroupId)) STATE.currentGroupId = STATE.groups[0]?.id || null; renderGroups(); if (STATE.currentGroupId) { loadHistoryFromLocal(STATE.currentGroupId); renderChat(); } if (data.voiceParticipants) Object.entries(data.voiceParticipants).forEach(([gid,pids]) => STATE.voiceParticipants[gid]=new Set(pids)); if (data.userGroups) STATE.userGroups = data.userGroups; break;
      case 'group-list': STATE.groups = data.groups.map(g => ({...g, messages: STATE.groups.find(og=>og.id===g.id)?.messages||[]})); renderGroups(); break;
      case 'group-history': { const group = STATE.groups.find(g=>g.id===data.groupId); if(group) { group.messages = data.messages; if(STATE.currentGroupId===data.groupId) renderChat(); } break; }
      case 'chat-broadcast': processMessage(data); break;
      case 'voice-update': { const {groupId, peerId, action} = data; if (!STATE.voiceParticipants[groupId]) STATE.voiceParticipants[groupId] = new Set(); if (action==='join') { STATE.voiceParticipants[groupId].add(peerId); if (peerId!==STATE.peer.id && STATE.myVoiceGroup===groupId) connectToVoiceParticipants(groupId); } else if (action==='leave') { STATE.voiceParticipants[groupId].delete(peerId); closeVoiceCallsOfPeer(groupId, peerId); } renderGroups(); break; }
      case 'speaking-update': STATE.userSpeaking[data.peerId] = data.speaking; updateSpeakingUI(data.peerId, data.speaking); break;
      case 'reaction': { handleRemoteReaction(data); break; }
      case 'room-locked': alert('Room is locked.'); STATE.hostConn.close(); break;
      case 'room-full': alert('Room is full.'); STATE.hostConn.close(); break;
    }
  }

  function closeVoiceCallsOfPeer(groupId, peerId) { if (STATE.voiceCallsByGroup[groupId]?.[peerId]) { STATE.voiceCallsByGroup[groupId][peerId].close(); delete STATE.voiceCallsByGroup[groupId][peerId]; } }

  // Emoji cloud
  emojiBtn.onclick = (e) => {
    const existing = document.querySelector('.emoji-cloud');
    if (existing) { existing.remove(); return; }
    const cloud = document.createElement('div'); cloud.className = 'emoji-cloud';
    const emojis = ['😀','😂','😍','😢','😡','👍','👎','❤️','🔥','🎉','🤔','😎','🙌','💪','😭','✨','😊','😉','😴','😇','🤗','😋','😜','🐱','🐶','🌸','🌟','🍕','🎂'];
    emojis.forEach(emoji => {
      const span = document.createElement('span'); span.textContent = emoji;
      span.onclick = () => { chatInput.value += emoji; };
      cloud.appendChild(span);
    });
    cloud.style.position = 'absolute'; cloud.style.bottom = '60px'; cloud.style.left = '20px';
    document.getElementById('mainPanel').appendChild(cloud);
    const closeCloud = (ev) => { if (!cloud.contains(ev.target) && ev.target !== emojiBtn) { cloud.remove(); document.removeEventListener('click', closeCloud); } };
    document.addEventListener('click', closeCloud);
  };

  // Settings modal
  settingsBtn.onclick = () => { if(!STATE.isHost) return; document.getElementById('roomNameInput').value=STATE.roomName; document.getElementById('settingsModal').style.display='block'; };
  document.getElementById('saveSettingsBtn').onclick = () => { STATE.roomName=document.getElementById('roomNameInput').value||STATE.roomName; roomTitleEl.textContent=STATE.roomName; document.getElementById('settingsModal').style.display='none'; };
  document.getElementById('closeSettingsBtn').onclick = () => document.getElementById('settingsModal').style.display='none';

  // Name modal
  document.getElementById('editNameBtn').onclick = () => { document.getElementById('newNameInput').value=STATE.myName; document.getElementById('statusSelect').value=STATE.status; document.getElementById('nameModal').style.display='block'; };
  document.getElementById('saveNameBtn').onclick = () => {
    const newName = document.getElementById('newNameInput').value.trim() || STATE.myName;
    const newStatus = document.getElementById('statusSelect').value;
    const newColor = (newName !== STATE.myName) ? colorFromName(newName) : STATE.myColor;
    STATE.myName = newName;
    STATE.myColor = newColor;
    STATE.status = newStatus;
    if (STATE.isHost) {
      STATE.users[STATE.peer.id] = newName;
      STATE.usersColors[STATE.peer.id] = newColor;
      STATE.usersStatus[STATE.peer.id] = newStatus;
      broadcastUserList();
    } else {
      STATE.hostConn?.send({type:'change-status', status: newStatus});
    }
    document.getElementById('nameModal').style.display = 'none';
    renderUserList();
  };
  document.getElementById('closeNameModalBtn').onclick = () => document.getElementById('nameModal').style.display='none';

  // Save/Load
  saveRoomBtn.onclick = () => { if(!STATE.isHost) return; const data={roomName:STATE.roomName,groups:STATE.groups.map(g=>({id:g.id,name:g.name,messages:g.messages}))}; const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`echo-${STATE.roomName}.json`; a.click(); };
  loadRoomBtn.onclick = () => loadRoomFile.click();
  loadRoomFile.onchange = () => { const file=loadRoomFile.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=>{ try{ const data=JSON.parse(reader.result); STATE.groups=data.groups.map(g=>({...g,messages:g.messages||[]})); STATE.roomName=data.roomName||'restored'; initHost(STATE.roomName); }catch(e){alert('Invalid file.');} }; reader.readAsText(file); };

  sendChatBtn.onclick = sendMessage;
  chatInput.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });
  searchInput.oninput = () => renderChat(searchInput.value);

  window.addEventListener('load', () => { const hash=window.location.hash.substring(1); const p=new URLSearchParams(hash); const host=p.get('host'),room=p.get('room'); if(host) initClient(host,room||'joined'); });
})();
</script>
</body>
</html>
